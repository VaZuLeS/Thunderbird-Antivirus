<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thundy AV – E-Mail-Scanner</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            width: 600px;
        }

        #hybrid_analysis_api_content {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <header class="page-header">
        <img src="img/icon-48px.png" alt="" width="32" height="32">
        <div>
            <h1 class="page-title">Thundy AV</h1>
            <p class="page-subtitle">Thunderbird Security Antivirus – E-Mail-Scanner</p>
        </div>
    </header>

    <p class="mt-2">
        <a href="https://www.hybrid-analysis.com/my-submissions/all" target="_blank" rel="noopener noreferrer"
            aria-label="Alle Übertragungen zu Hybrid Analysis aufrufen (öffnet in einem neuen Tab)">Alle Übertragungen zu
            Hybrid Analysis aufrufen <span aria-hidden="true">↗</span></a>
    </p>

    <h2>Nachricht</h2>
    <dl class="grid-container">
        <dt class="grid-header">Betreff:</dt>
        <dd id="subject" class="grid-content"></dd>

        <dt class="grid-header">Von:</dt>
        <dd id="from" class="grid-content"></dd>

        <dt class="grid-header">Message-ID:</dt>
        <dd id="MessageHeaderID" class="grid-content"></dd>
    </dl>

    <div id="status_message" class="grid-content mt-2" style="font-weight: bold;" aria-live="polite" role="status"></div>

    <h2>Analyseergebnisse</h2>
    <div id="hybrid_analysis_api_content" class="grid-content"></div>

    <script src="db.js"></script>
    <script type="module" src="api.js"></script>
</body>

</html>
