<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderbird Security Antivirus aka Thundy AV</title>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="thundy-popup">
    <header class="thundy-card thundy-popup__header">
        <div class="thundy-card__header">
            <h1 class="thundy-card__title">Thunderbird Security Antivirus aka Thundy AV</h1>
            <span id="consent-status-badge" class="thundy-badge thundy-badge--info" role="status" aria-live="polite">Zustimmung wird geprüft …</span>
        </div>
        <div class="thundy-card__body">
            <a href="https://www.hybrid-analysis.com/my-submissions/all" target="_blank" rel="noopener noreferrer" aria-label="Alle Übertragungen zu Hybrid Analysis aufrufen (öffnet in einem neuen Tab)">Alle Übertragungen zu Hybrid Analysis aufrufen <span class="thundy-exticon" aria-hidden="true">↗</span></a>
        </div>
    </header>

    <section class="thundy-card" aria-label="Metadaten der Nachricht">
        <div class="thundy-card__body">
            <dl class="thundy-kv">
                <dt class="thundy-kv__key">Betreff:</dt>
                <dd id="subject" class="thundy-kv__value"></dd>

                <dt class="thundy-kv__key">Von:</dt>
                <dd id="from" class="thundy-kv__value"></dd>

                <dt class="thundy-kv__key">MessageHeaderID:</dt>
                <dd id="MessageHeaderID" class="thundy-kv__value"></dd>
            </dl>
        </div>
    </section>

    <div id="status_message" class="thundy-status mt-2" aria-live="polite" role="status"></div>

    <div class="thundy-toolbar" role="group" aria-label="Bericht exportieren">
        <button type="button" id="btn-export-json" class="btn-primary">Bericht als JSON exportieren</button>
        <button type="button" id="btn-export-csv" class="btn-primary">Ergebnisse als CSV exportieren</button>
        <button type="button" id="btn-copy-iocs" class="btn-primary">IOC-Liste kopieren</button>
    </div>

    <div id="report-root" class="thundy-report">
        <div id="report-skeleton" class="thundy-card" aria-hidden="true">
            <div class="thundy-card__body">
                <span class="thundy-skeleton"></span>
                <span class="thundy-skeleton thundy-skeleton--short"></span>
            </div>
        </div>
        <div id="hybrid_analysis_api_content" class="thundy-report__mount"></div>
    </div>

    <div id="research-root" class="thundy-research" aria-label="Forscheransicht"></div>

    <script src="db.js"></script>
    <script type="module" src="api.js"></script>
</body>

</html>
