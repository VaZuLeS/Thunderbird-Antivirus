name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Pre-submit checks (manifest, privacy, permissions)
        run: node ./scripts/pre-submit-checks.js
      - name: Verify bundled English fallback
        run: npm run check:i18n
      - name: Verify bundled Public Suffix List
        run: npm run check:vendor
      - name: Verify generated design assets
        run: npm run check:design
      - name: Run unit tests
        run: npm test
      - name: web-ext lint
        run: npm run lint:filtered
      - name: Build and verify extension package
        run: npm run package
      - name: Preserve package for real Thunderbird checks
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-test-package
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-ui:
    name: Browser UI (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [en, de, fr, es, it, pl]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check layouts, keyboard, exports and accessibility
        run: npm run check:ui -- --lang ${{ matrix.language }}
      - name: Preserve browser evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ matrix.language }}
          path: .audit/ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  thunderbird-live:
    name: Thunderbird Linux GUI
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install real Thunderbird and isolated X11 runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends thunderbird xvfb python3 imagemagick libxtst6
          useradd --create-home thunderbird-test
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: thunderbird-test-package
          path: build
      - name: Check real wizard, link audit, native popup and themes
        run: |
          mkdir -p .audit
          chown thunderbird-test .audit
          set -- build/*.zip
          test "$#" -eq 1
          cp "$1" .audit/thundy-av.xpi
          chmod 644 .audit/thundy-av.xpi
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --out .audit/thunderbird-live
      - name: Preserve real-client report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-linux-live
          path: .audit/thunderbird-live/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
