name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Pre-submit checks (manifest, privacy, permissions)
        run: node ./scripts/pre-submit-checks.js
      - name: Verify bundled English fallback
        run: npm run check:i18n
      - name: Verify bundled Public Suffix List
        run: npm run check:vendor
      - name: Verify generated design assets
        run: npm run check:design
      - name: Run unit tests
        run: npm test
      - name: web-ext lint
        run: npm run lint:filtered
      - name: Build and verify extension package
        run: npm run package

  browser-ui:
    name: Browser UI (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [en, de, fr, es, it, pl]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check layouts, keyboard, exports and accessibility
        run: npm run check:ui -- --lang ${{ matrix.language }}
      - name: Preserve browser evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ matrix.language }}
          path: .audit/ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
