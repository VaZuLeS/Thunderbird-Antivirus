name: CI

on:
  workflow_call:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

# PR workflows check the merge context. Standalone branch pushes still run;
# push workflows with an open same-repository PR defer to its full PR workflow.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.route.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: route
        with:
          script: |
            const { shouldRunChecks } = require('./scripts/ci-event.js');
            return await shouldRunChecks({
              eventName: context.eventName, ref: context.ref,
              defaultBranch: context.payload.repository.default_branch,
              owner: context.repo.owner, repository: context.repo.repo,
              listOpenPulls: async options => (await github.rest.pulls.list(options)).data
            });

  test:
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build the separate web demo
        run: npm run check:web
      - name: Pre-submit checks (manifest, privacy, permissions)
        run: node ./scripts/pre-submit-checks.js
      - name: Verify bundled English fallback
        run: npm run check:i18n
      - name: Verify bundled Public Suffix List
        run: npm run check:vendor
      - name: Verify generated design assets
        run: npm run check:design
      - name: Run unit tests
        run: npm test
      - name: Verify identity probe preserves non-local MIME bytes
        run: python3 tools/test_thunderbird_identity.dev.py -v
      - name: web-ext lint
        run: npm run lint:filtered
      - name: Build and verify extension package
        run: npm run package
      - name: Preserve package for real Thunderbird checks
        uses: actions/upload-artifact@v7
        with:
          name: thunderbird-test-package
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-ui:
    needs: route
    if: needs.route.outputs.run == 'true'
    name: Browser UI (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [en, de, fr, es, it, pl]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check layouts, keyboard, exports and accessibility
        run: npm run check:ui -- --lang ${{ matrix.language }}
      - name: Check 200 percent CSS zoom in settings and audit
        run: |
          npm run check:ui -- --lang ${{ matrix.language }} --view options.html --zoom 2
          npm run check:ui -- --lang ${{ matrix.language }} --view audit.html --zoom 2
          npm run check:ui -- --lang ${{ matrix.language }} --view security.html --zoom 2
          npm run check:ui -- --lang ${{ matrix.language }} --view source_export.html --zoom 2
      - name: Preserve browser evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ui-${{ matrix.language }}
          path: .audit/ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  thunderbird-live:
    name: Thunderbird Linux GUI (${{ matrix.client }})
    strategy:
      fail-fast: false
      matrix:
        client: [minimum, current]
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    env:
      CLIENT_TARGET: ${{ matrix.client }}
      THUNDY_MINIMUM_DEBIAN_VERSION: '1:140.12.0esr-1~deb13u1'
    steps:
      - name: Install real Thunderbird and isolated X11 runtime
        run: |
          apt-get update
          set -- thunderbird thunderbird-l10n-de thunderbird-l10n-fr thunderbird-l10n-es-es thunderbird-l10n-it thunderbird-l10n-pl
          if test "$CLIENT_TARGET" = minimum; then
            set -- "thunderbird=$THUNDY_MINIMUM_DEBIAN_VERSION" "thunderbird-l10n-de=$THUNDY_MINIMUM_DEBIAN_VERSION" "thunderbird-l10n-fr=$THUNDY_MINIMUM_DEBIAN_VERSION" "thunderbird-l10n-es-es=$THUNDY_MINIMUM_DEBIAN_VERSION" "thunderbird-l10n-it=$THUNDY_MINIMUM_DEBIAN_VERSION" "thunderbird-l10n-pl=$THUNDY_MINIMUM_DEBIAN_VERSION"
          fi
          apt-get install -y --no-install-recommends "$@" xvfb python3 imagemagick libxtst6 ca-certificates gnupg openssl
          useradd --create-home thunderbird-test
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: thunderbird-test-package
          path: build
      - name: Download pinned previous release for upgrade checks
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, urllib.request
          url = 'https://github.com/VaZuLeS/Thunderbird-Antivirus/releases/download/v1.25.5/thundy-av-1.25.5.xpi'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != 'e1ece067f01e169063d92e944c60a3d88b5c933630fa3a7ab6991a2a33cbaaaa':
              raise SystemExit('Previous release hash mismatch')
          pathlib.Path('build/previous.xpi').write_bytes(data)
          PYTHON
          chmod 644 build/previous.xpi
      - name: Check real installs, crash recovery, OS dispatch and six languages
        run: |
          mkdir -p .audit
          chown thunderbird-test .audit
          set -- build/*.zip
          test "$#" -eq 1
          cp "$1" .audit/thundy-av.xpi
          chmod 644 .audit/thundy-av.xpi
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --resource-isolation-check --context-load-check --identity-lifecycle-check --mime-content-check --unicode-input-check --report-actions-check --out .audit/thunderbird-live/install-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --security-check --out .audit/thunderbird-live/security-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --stored-source-check --out .audit/thunderbird-live/stored-sources-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --source-history-check --out .audit/thunderbird-live/source-history-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --report-archive-check --out .audit/thunderbird-live/report-archive-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --source-export-check --out .audit/thunderbird-live/source-export-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --history-pages-check --out .audit/thunderbird-live/history-pages-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --active-sources-check --out .audit/thunderbird-live/active-sources-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --automatic-scan-check --out .audit/thunderbird-live/automatic-scans-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --inline-scan-check --out .audit/thunderbird-live/inline-scan-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --inline-fresh-scan-check --out .audit/thunderbird-live/inline-fresh-scan-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --scan-coverage-check --out .audit/thunderbird-live/scan-coverage-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --storage-lifecycle-check --out .audit/thunderbird-live/storage-lifecycle-en
          runuser -u thunderbird-test -- python3 tools/crypto-fixtures.dev.py --out /tmp/thundy-crypto-fixtures
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --crypto-fixtures /tmp/thundy-crypto-fixtures --out .audit/thunderbird-live/crypto-en
          for lang in en de fr es it pl; do
            set -- --locale "$lang"
            if test "$lang" != en; then
              pack="$lang"
              if test "$lang" = es; then pack=es-ES; fi
              set -- "$@" --langpack "/usr/lib/thunderbird/extensions/langpack-$pack@thunderbird.mozilla.org.xpi"
            fi
            runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --previous-xpi build/previous.xpi "$@" --out ".audit/thunderbird-live/$lang"
            if test "$lang" = en; then set -- "$@" --identity-check; fi
            runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --previous-xpi build/previous.xpi --restart-check --crash-check --restore-check "$@" --out ".audit/thunderbird-live/restart-$lang"
          done
      - name: Bind the declared client target to successful native reports
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          for file in pathlib.Path('.audit/thunderbird-live').rglob('report.json'):
              report = json.loads(file.read_text())
              report['clientMatrixTarget'] = os.environ['CLIENT_TARGET']
              file.write_text(json.dumps(report, indent=2) + '\n')
          PYTHON
      - name: Preserve real-client report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thunderbird-linux-live-${{ matrix.client }}
          path: |
            .audit/thunderbird-live/
            !.audit/thunderbird-live/**/.rollback-profile/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  candidate-gate:
    name: Package-bound candidate gate
    needs: [test, browser-ui, thunderbird-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: thunderbird-test-package
          path: build
      - uses: actions/download-artifact@v8
        with:
          pattern: thunderbird-linux-live-*
          path: .audit/thunderbird-live
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-ui-*
          path: .audit/browser
      - name: Bind exact tested bytes and six-language reports
        run: node scripts/candidate-evidence.js --write .audit/thunderbird-live .audit/browser
      - name: Verify candidate without claiming publication
        run: npm run goal -- --candidate
      - name: Generate and revalidate redacted acceptance evidence
        run: |
          node scripts/release-evidence.js
          node - <<'JS'
          const fs=require('node:fs'),proof=require('./scripts/release-evidence.js');
          const identity=require('./scripts/candidate-evidence.js').packageIdentity();
          const evidence=JSON.parse(fs.readFileSync('build/acceptance-'+identity.extensionVersion+'.json'));
          proof.verify(evidence,identity);
          console.log(JSON.stringify({kind:evidence.kind,commit:evidence.commit,...identity,limits:evidence.limits}));
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: validated-release-candidate
          path: |
            build/*.zip
            build/acceptance-*.json
            docs/audits/candidate-*.json
          if-no-files-found: error
          retention-days: 14
