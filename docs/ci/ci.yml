name: CI

on:
  workflow_call:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

# PR workflows check the merge context. Standalone branch pushes still run;
# push workflows with an open same-repository PR defer to its full PR workflow.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.route.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v8
        id: route
        with:
          script: |
            const { shouldRunChecks } = require('./scripts/ci-event.js');
            return await shouldRunChecks({
              eventName: context.eventName, ref: context.ref,
              defaultBranch: context.payload.repository.default_branch,
              owner: context.repo.owner, repository: context.repo.repo,
              listOpenPulls: async options => (await github.rest.pulls.list(options)).data
            });

  test:
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build the separate web demo
        run: npm run check:web
      - name: Pre-submit checks (manifest, privacy, permissions)
        run: node ./scripts/pre-submit-checks.js
      - name: Verify bundled English fallback
        run: npm run check:i18n
      - name: Verify bundled Public Suffix List
        run: npm run check:vendor
      - name: Verify generated design assets
        run: npm run check:design
      - name: Run unit tests
        run: npm test
      - name: Verify identity probe preserves non-local MIME bytes
        run: python3 tools/test_thunderbird_identity.dev.py -v
      - name: web-ext lint
        run: npm run lint:filtered
      - name: Build and verify extension package
        run: npm run package
      - name: Preserve package for real Thunderbird checks
        uses: actions/upload-artifact@v7
        with:
          name: thunderbird-test-package
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-ui:
    needs: route
    if: needs.route.outputs.run == 'true'
    name: Browser UI (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [en, de, fr, es, it, pl]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check layouts, keyboard, exports and accessibility
        run: npm run check:ui -- --lang ${{ matrix.language }}
      - name: Check 200 percent CSS zoom in settings and audit
        run: |
          npm run check:ui -- --lang ${{ matrix.language }} --view options.html --zoom 2
          npm run check:ui -- --lang ${{ matrix.language }} --view audit.html --zoom 2
      - name: Preserve browser evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ui-${{ matrix.language }}
          path: .audit/ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  thunderbird-live:
    name: Thunderbird Linux GUI
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install real Thunderbird and isolated X11 runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends thunderbird thunderbird-l10n-de thunderbird-l10n-fr thunderbird-l10n-es-es thunderbird-l10n-it thunderbird-l10n-pl xvfb python3 imagemagick libxtst6 ca-certificates
          useradd --create-home thunderbird-test
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: thunderbird-test-package
          path: build
      - name: Download pinned previous release for upgrade checks
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, urllib.request
          url = 'https://github.com/VaZuLeS/Thunderbird-Antivirus/releases/download/v1.24.7/thundy-av-1.24.7.xpi'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != 'b3441e54786a5c3d167e9f41024bbb87b931f572e04d5b98cd363c4a832a7730':
              raise SystemExit('Previous release hash mismatch')
          pathlib.Path('build/previous.xpi').write_bytes(data)
          PYTHON
          chmod 644 build/previous.xpi
      - name: Check real installs, crash recovery, OS dispatch and six languages
        run: |
          mkdir -p .audit
          chown thunderbird-test .audit
          set -- build/*.zip
          test "$#" -eq 1
          cp "$1" .audit/thundy-av.xpi
          chmod 644 .audit/thundy-av.xpi
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --resource-isolation-check --context-load-check --identity-lifecycle-check --mime-content-check --unicode-input-check --report-actions-check --out .audit/thunderbird-live/install-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --stored-source-check --out .audit/thunderbird-live/stored-sources-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --source-history-check --out .audit/thunderbird-live/source-history-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --report-archive-check --out .audit/thunderbird-live/report-archive-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --source-export-check --out .audit/thunderbird-live/source-export-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --history-pages-check --out .audit/thunderbird-live/history-pages-en
          runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --active-sources-check --out .audit/thunderbird-live/active-sources-en
          for lang in en de fr es it pl; do
            set -- --locale "$lang"
            if test "$lang" != en; then
              pack="$lang"
              if test "$lang" = es; then pack=es-ES; fi
              set -- "$@" --langpack "/usr/lib/thunderbird/extensions/langpack-$pack@thunderbird.mozilla.org.xpi"
            fi
            runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --previous-xpi build/previous.xpi "$@" --out ".audit/thunderbird-live/$lang"
            if test "$lang" = en; then set -- "$@" --identity-check; fi
            runuser -u thunderbird-test -- python3 tools/thunderbird-live.dev.py --thunderbird /usr/lib/thunderbird/thunderbird-bin --xvfb /usr/bin/Xvfb --xpi .audit/thundy-av.xpi --previous-xpi build/previous.xpi --restart-check --crash-check --restore-check "$@" --out ".audit/thunderbird-live/restart-$lang"
          done
      - name: Preserve real-client report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thunderbird-linux-live
          path: .audit/thunderbird-live/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  candidate-gate:
    name: Package-bound candidate gate
    needs: [test, browser-ui, thunderbird-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: thunderbird-test-package
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: thunderbird-linux-live
          path: .audit/thunderbird-live
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-ui-*
          path: .audit/browser
      - name: Bind exact tested bytes and six-language reports
        run: node scripts/candidate-evidence.js --write .audit/thunderbird-live .audit/browser
      - name: Verify candidate without claiming publication
        run: npm run goal -- --candidate
      - uses: actions/upload-artifact@v7
        with:
          name: validated-release-candidate
          path: |
            build/*.zip
            docs/audits/candidate-*.json
          if-no-files-found: error
          retention-days: 14
