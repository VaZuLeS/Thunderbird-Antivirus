name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Pre-submit checks (manifest, permissions, data collection, assets)
        run: npm run pre-submit-checks
      - name: Run unit tests
        run: npm test
      - name: web-ext lint (errors block, known Thunderbird false positives are filtered)
        run: |
          npx web-ext lint --source-dir . --output json > /tmp/lint.json
          node scripts/filter-lint-warnings.js /tmp/lint.json
      - name: Build XPI and verify package contents
        run: npm run build
