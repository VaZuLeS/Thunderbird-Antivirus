name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      # Single step on purpose: the workflow runs exactly the same command that
      # contributors run locally, so the CI cannot drift from npm run check.
      # It covers: pre-submit checks, submission gate, all tests,
      # web-ext lint with the known Thunderbird false positives filtered and
      # the XPI build with the package content check.
      - name: Full quality gate (npm run check)
        run: npm run check

