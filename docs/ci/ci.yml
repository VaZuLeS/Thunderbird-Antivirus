name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pre-submit checks (manifest, privacy, permissions, data declaration, assets)
        run: npm run pre-submit-checks
      - name: Unit tests (complete suite)
        run: npm test
      - name: web-ext lint with curated Thunderbird allow-list
        run: npm run lint:filtered
      - name: Build XPI and verify the package content
        run: npm run package
      - name: Upload the built XPI as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-xpi
          path: build/*.zip
          if-no-files-found: warn
